version: "3.9"

services:

  gazebo:
    container_name: gazebo
    build:
      context: .
      dockerfile: docker/gazebo.Dockerfile

    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=${PULSE_SERVER}
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GAZEBO_MODEL_PATH=/gazebo_ws/models:/plugins/ardupilot_gazebo/models
      - GAZEBO_RESOURCE_PATH=/gazebo_ws/worlds:/usr/share/gazebo-11

    volumes:
      - ./gazebo_ws:/gazebo_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl

    devices:
      - /dev/dxg

    runtime: nvidia
    privileged: true
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true

  betaflight_sitl:
    container_name: betaflight_sitl
    build:
      context: .
      dockerfile: docker/beta_sitl.Dockerfile
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ./betaflight_ws:/betaflight_ws
    command: /bin/bash -c "./obj/main/betaflight_SITL.elf < /betaflight/init.cli"

  python_controller:
    container_name: python_controller
    build:
      context: .
      dockerfile: docker/python_controller.Dockerfile
    network_mode: host
    volumes:
      - ./controller:/app
    depends_on:
      - betaflight_sitl
    command: python3 controller.py
